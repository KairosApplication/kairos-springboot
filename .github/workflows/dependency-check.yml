name: Dependency check

on:
  pull_request:
    branches: [main]
    paths:
      - pom.xml
      - .mvn/**
      - mvnw
      - .github/workflows/dependency-check.yml
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Restore vulnerability database
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          key: nvd-v1-${{ runner.os }}-${{ hashFiles('pom.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nvd-v1-${{ runner.os }}-${{ hashFiles('pom.xml') }}-
      - name: Update vulnerability database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw --batch-mode --no-transfer-progress -Pdependency-check dependency-check:update-only
      - name: Cache updated vulnerability database
        uses: actions/cache/save@v4
        with:
          path: .dependency-check-data
          key: nvd-v1-${{ runner.os }}-${{ hashFiles('pom.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Scan dependencies
        run: bash ./mvnw --batch-mode --no-transfer-progress -Pdependency-check dependency-check:check -DautoUpdate=false
      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 14
