name: kairos-development

services:
  secrets:
    image: eclipse-temurin:21-jre-jammy
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        if [ ! -s /secrets/signing-key ]; then
          head -c 32 /dev/urandom | base64 > /secrets/signing-key
        fi
        if [ ! -s /history/internal-key ]; then
          head -c 32 /dev/urandom | base64 > /history/internal-key
        fi
        chown -R 10001:10001 /secrets
        chmod 700 /secrets
        chmod 600 /secrets/signing-key
        chown -R 10001:10001 /history
        chmod 700 /history
        chmod 600 /history/internal-key
    volumes:
      - auth-secrets:/secrets
      - history-secrets:/history

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kairos_dev
      POSTGRES_USER: kairos_dev
      POSTGRES_PASSWORD: kairos-local-only
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos_dev -d kairos_dev"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    image: kairos-api-development:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export AUTH_SIGNING_KEY=$$(cat /run/kairos-secrets/signing-key)
        export KAIROS_INTERNAL_API_KEY=$$(cat /run/history-secrets/internal-key)
        exec java -jar /app/app.jar
    environment:
      API_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/kairos_dev
      DB_USERNAME: kairos_dev
      DB_PASSWORD: kairos-local-only
      JPA_DDL_AUTO: validate
      REDIS_URL: redis://redis:6379
      KAIROS_REDIS_API_ENABLED: "true"
      KAIROS_REDIS_API_URL: http://redis-history-api:8001
      AUTH_ISSUER: kairos-development
      AUTH_AUDIENCE: kairos-development-clients
      AUTH_ACCESS_TTL: ${DEV_AUTH_ACCESS_TTL:-15s}
      AUTH_SESSION_TTL: 7d
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8081}:8080"
    volumes:
      - auth-secrets:/run/kairos-secrets:ro
      - history-secrets:/run/history-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-history-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health HTTP/1.0\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      start_period: 60s
      interval: 5s
      timeout: 3s
      retries: 30

  seed:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: kairos-local-only
    command: ["psql", "-h", "postgres", "-U", "kairos_dev", "-d", "kairos_dev", "-v", "ON_ERROR_STOP=1", "-f", "/fixtures/seed.sql"]
    volumes:
      - ./development/seed.sql:/fixtures/seed.sql:ro
    depends_on:
      api:
        condition: service_healthy

  smoke:
    profiles: ["check"]
    image: python:3.13-alpine
    command: ["python", "/checks/smoke.py"]
    environment:
      TEST_API_URL: http://api:8080/api/v1
    volumes:
      - ./development/smoke.py:/checks/smoke.py:ro
      - ./development/history_smoke.py:/checks/history_smoke.py:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      redis-history-api:
        condition: service_healthy

  redis-history-api:
    image: kairos-redis-history-api:local
    build:
      context: .
      dockerfile: development/redis-api.Dockerfile
      additional_contexts:
        kairos_data: https://github.com/KairosApplication/kairos-data.git#10d6b08745b3cd885223670ec19d2befd3f87416
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export KAIROS_INTERNAL_API_KEY=$$(cat /run/history-secrets/internal-key)
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      REDIS_URL: redis://redis-history:6379/0
      MAX_RESTOCKINGS_PER_WEEK: "500"
    volumes:
      - history-secrets:/run/history-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
      redis-history:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-history:
    image: redis:8.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    profiles: ["test"]
    image: redis:8.6-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  tests:
    profiles: ["test"]
    network_mode: service:redis-test
    image: kairos-api-development-tests:local
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mvn -B -ntp -Dintegration.redis=true verify
        result=$$?
        mkdir -p /reports
        cp -R target/surefire-reports /reports/ 2>/dev/null || true
        cp -R target/site /reports/ 2>/dev/null || true
        exit $$result
    volumes:
      - maven-cache:/root/.m2
      - ./target/development-tests:/reports
    depends_on:
      redis-test:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  auth-secrets:
  history-secrets:
  maven-cache:
