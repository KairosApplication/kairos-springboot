server:
  port: ${API_PORT:8080}

app:
  auth:
    signing-key: ${AUTH_SIGNING_KEY}
    issuer: ${AUTH_ISSUER:kairos-api}
    audience: ${AUTH_AUDIENCE:kairos-clients}
    access-ttl: ${AUTH_ACCESS_TTL:15m}
    session-ttl: ${AUTH_SESSION_TTL:7d}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  application:
    name: kairos-api-postgres
  data:
    redis:
      repositories:
        enabled: false
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  cache:
    type: redis
    cache-names: categories
    redis:
      time-to-live: 5m
      cache-null-values: false

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

  endpoint:
    health:
      show-details: when-authorized
