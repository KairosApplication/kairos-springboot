app:
  auth:
    # Public test fixture only; never use this key outside tests.
    signing-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    issuer: kairos-test
    audience: kairos-tests
    access-ttl: 15m
    session-ttl: 7d
    cookie-secure: false
    cookie-same-site: Lax
spring:
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:kairos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

  health:
    redis:
      enabled: false
